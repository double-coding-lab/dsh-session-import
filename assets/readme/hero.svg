<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">dsh-session-import — DeepSeekRuntime 会话导入插件</title>
  <desc id="hero-desc">把 Qoder、Claude Code、Codex、WorkBuddy 的会话导入成 DSH 原生会话。</desc>

  <rect width="1200" height="420" rx="26" fill="#0B0D10"/>

  <g id="title-block">
    <text x="64" y="86" fill="#7F8996" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="2">DEEPSEEK HARNESS · SESSION IMPORT PLUGIN</text>
    <text x="64" y="166" fill="#F7F8FA" font-size="58" font-weight="700" letter-spacing="-1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">dsh-session-import</text>
    <text x="64" y="224" fill="#C9D0D9" font-size="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">把其他 AI 编程工具的会话搬进 DSH</text>
    <line x1="64" y1="312" x2="628" y2="312" stroke="#242A32" stroke-width="1"/>
    <text x="64" y="340" fill="#6F7884" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">qoder · claude code · codex · workbuddy</text>
  </g>

  <g id="panel-proof">
    <rect x="672" y="56" width="464" height="308" rx="22" fill="#11151A" stroke="#262C34"/>
    <text x="696" y="94" fill="#F4F6F8" font-size="20" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">会话导入</text>
    <text x="1112" y="92" fill="#6F7884" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="end">只读扫描</text>
    <g id="chip-qoder">
      <rect x="696" y="112" width="202" height="44" rx="10" fill="#0E1217"/>
      <rect x="706" y="120" width="28" height="28" rx="8" fill="#FFFFFF"/>
      <image x="711" y="125" width="18" height="18" href="data:image/png;base64,"/>
      <text x="744" y="140" fill="#F4F6F8" font-size="16" font-weight="600">Qoder</text>
      <rect x="864" y="126" width="16" height="16" rx="4" fill="#F4F6F8"/>
      <path d="M868 134l3 3 6-7" fill="none" stroke="#0B0D10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="chip-claude-code">
      <rect x="910" y="112" width="202" height="44" rx="10" fill="#0E1217"/>
      <rect x="920" y="120" width="28" height="28" rx="8" fill="#FFFFFF"/>
      <g stroke="#D97757" stroke-width="2" stroke-linecap="round"><line x1="934.00" y1="142.50" x2="934.00" y2="125.50"/><line x1="929.75" y1="141.36" x2="938.25" y2="126.64"/><line x1="926.64" y1="138.25" x2="941.36" y2="129.75"/><line x1="925.50" y1="134.00" x2="942.50" y2="134.00"/><line x1="926.64" y1="129.75" x2="941.36" y2="138.25"/><line x1="929.75" y1="126.64" x2="938.25" y2="141.36"/></g>
      <text x="958" y="140" fill="#F4F6F8" font-size="16" font-weight="600">Claude Code</text>
      <rect x="1078" y="126" width="16" height="16" rx="4" fill="#F4F6F8"/>
      <path d="M1082 134l3 3 6-7" fill="none" stroke="#0B0D10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="chip-codex">
      <rect x="696" y="164" width="202" height="44" rx="10" fill="#0E1217"/>
      <rect x="706" y="172" width="28" height="28" rx="8" fill="#FFFFFF"/>
      <image x="711" y="177" width="18" height="18" href="data:image/png;base64,"/>
      <text x="744" y="192" fill="#F4F6F8" font-size="16" font-weight="600">Codex</text>
      <rect x="864" y="178" width="16" height="16" rx="4" fill="#F4F6F8"/>
      <path d="M868 186l3 3 6-7" fill="none" stroke="#0B0D10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="chip-workbuddy">
      <rect x="910" y="164" width="202" height="44" rx="10" fill="#0E1217"/>
      <rect x="920" y="172" width="28" height="28" rx="8" fill="#FFFFFF"/>
      <image x="925" y="177" width="18" height="18" href="data:image/png;base64,"/>
      <text x="958" y="192" fill="#F4F6F8" font-size="16" font-weight="600">WorkBuddy</text>
      <rect x="1078" y="178" width="16" height="16" rx="4" fill="#F4F6F8"/>
      <path d="M1082 186l3 3 6-7" fill="none" stroke="#0B0D10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <line x1="696" y1="225" x2="856" y2="225" stroke="#242A32" stroke-width="1"/>
    <rect x="868" y="211" width="72" height="28" rx="14" fill="#E9EDF2"/>
    <text x="904" y="230" fill="#0B0D10" font-size="15" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">导入</text>
    <line x1="952" y1="225" x2="1112" y2="225" stroke="#242A32" stroke-width="1"/>

    <g id="dsh-session">
      <rect x="690" y="252" width="428" height="76" rx="12" fill="#0E1217" stroke="#242A32"/>
      <rect x="704" y="272" width="32" height="32" rx="9" fill="#FFFFFF"/>
      <path d="M713 279h14a3 3 0 013 3v8a3 3 0 01-3 3h-7l-5 4v-4h-2a3 3 0 01-3-3v-8a3 3 0 013-3z" fill="#0B0D10"/>
      <text x="750" y="283" fill="#F4F6F8" font-size="18" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">迁移脚本改造</text>
      <text x="750" y="308" fill="#6F7884" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Qoder → DSH v4 · 可直接续聊</text>
      <rect x="1030" y="272" width="72" height="24" rx="12" fill="#12251C" stroke="#1F4A35"/>
      <text x="1066" y="289" fill="#7BE8B0" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" text-anchor="middle">已导入</text>
    </g>
  </g>
